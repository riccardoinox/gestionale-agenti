services:
  - type: web
    name: gestionale-agenti
    env: python
    region: frankfurt # Low latency in Europe / Italy
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
